<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b2418" />
    <meta name="description" content="A personal map of Israel's coffee. Rate a cup, part the clouds, raise a building." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>CoffeMap</title>
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand__cup" aria-hidden="true">☕</span>
        <div>
          <h1>CoffeMap</h1>
          <p id="stats" class="brand__stats">No cups rated yet</p>
        </div>
      </div>
      <form id="search" class="search" role="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search a café or address…" aria-label="Search places" />
        <ul id="search-results" class="search__results" hidden></ul>
      </form>
      <div class="menu">
        <button id="menu-btn" class="icon-btn" aria-label="Menu" aria-haspopup="true">⋯</button>
        <div id="menu" class="menu__list" hidden>
          <button data-action="export">Export my ratings</button>
          <button data-action="import">Import ratings…</button>
          <button data-action="reset-view">Show all of Israel</button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <aside id="panel" class="panel" aria-live="polite"></aside>

    <div id="pick-banner" class="pick-banner" hidden>
      <span>Tap the map where you had your coffee</span>
      <button id="locate-btn" class="btn btn--ghost">📍 Use my location</button>
      <button id="pick-cancel" class="btn btn--ghost">Cancel</button>
    </div>

    <button id="rate-btn" class="fab">
      <span aria-hidden="true">＋</span> Rate a coffee
    </button>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
